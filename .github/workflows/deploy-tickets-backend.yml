# Despliega únicamente showpass-api en el servidor (compose multi-servicio).
# No reconstruye otros servicios del mismo docker-compose.yml.
# Se dispara al mergear un PR a main (push a main) o manualmente.

name: Deploy showpass-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-showpass-api
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH → build showpass-api
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: git pull + deploy showpass-api
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            export COMPOSE_SERVICE='showpass-api'
            # 1) git pull en showpass-api/tickets-backend  2) docker compose build/up solo showpass-api
            bash "${DEPLOY_PATH}/showpass-api/tickets-backend/scripts/deploy-tickets-backend.sh"
